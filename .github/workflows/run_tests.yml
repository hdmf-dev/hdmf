name: Run tests
on:
  push:
    branches:
      - dev
    tags-ignore:  # exclude the rolling tag that the deploy-dev job moves to each dev commit
      - 'latest'
  pull_request:

permissions:
  contents: read

jobs:
  run-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE config below with "upload-wheels: true" specifies that wheels should be uploaded as an artifact
          - { name: linux-python3.10-minimum             , test-tox-env: pytest-py310-minimum           , python-ver: "3.10", os: ubuntu-latest }
          - { name: linux-python3.14-upgraded            , test-tox-env: pytest-py314-upgraded          , python-ver: "3.14", os: ubuntu-latest }
          - { name: linux-python3.14-upgraded-optional   , test-tox-env: pytest-py314-upgraded-optional , python-ver: "3.14", os: ubuntu-latest , upload-wheels: true }
          - { name: windows-python3.10-minimum           , test-tox-env: pytest-py310-minimum           , python-ver: "3.10", os: windows-latest }
          - { name: windows-python3.14-upgraded-optional , test-tox-env: pytest-py314-upgraded-optional , python-ver: "3.14", os: windows-latest }
          - { name: macos-python3.10-minimum             , test-tox-env: pytest-py310-minimum           , python-ver: "3.10", os: macos-15-intel }
          - { name: macos-python3.14-upgraded            , test-tox-env: pytest-py314-upgraded          , python-ver: "3.14", os: macos-latest }
          # No prebuilt wheels for numcodecs==0.15.1 for Python 3.14 on PyPI and cannot build numcodecs == 0.15.1 on macos-latest
          # So optional requirements testing on macos-latest (arm64) is disabled. See https://github.com/hdmf-dev/hdmf/pull/1367
          - { name: macos-python3.13-upgraded-optional   , test-tox-env: pytest-py313-upgraded-optional , python-ver: "3.13", os: macos-latest }
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python and tox
        uses: $/.github/actions/setup-python-tox
        with:
          python-version: ${{ matrix.python-ver }}
          # the leg that uploads wheels feeds the "latest" pre-release, so it builds from a cold cache
          pip-cache: ${{ matrix.upload-wheels && 'false' || 'true' }}

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --installpkg dist/*-none-any.whl

      - name: Test installation from a source distribution
        run: |
          tox -e wheelinstall --installpkg dist/*.tar.gz

      - name: Upload distribution as a workspace artifact
        if: ${{ matrix.upload-wheels }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist
          retention-days: 1  # the deploy-dev job consumes this within the same run

  run-gallery-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gallery-python3.10-minimum             , test-tox-env: gallery-py310-minimum           , python-ver: "3.10", os: ubuntu-latest }
          - { name: linux-gallery-python3.14-upgraded-optional   , test-tox-env: gallery-py314-upgraded-optional , python-ver: "3.14", os: ubuntu-latest }
          - { name: windows-gallery-python3.10-minimum           , test-tox-env: gallery-py310-minimum           , python-ver: "3.10", os: windows-latest }
          - { name: windows-gallery-python3.14-upgraded-optional , test-tox-env: gallery-py314-upgraded-optional , python-ver: "3.14", os: windows-latest }
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python and tox
        uses: $/.github/actions/setup-python-tox
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

  deploy-dev:
    name: Deploy pre-release from dev
    needs: [run-tests, run-gallery-tests]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write  # create the "latest" pre-release and move its tag
    steps:
      - name: Download wheel and source distributions from artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish wheel and source distributions as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -1 dist
          # The "latest" pre-release is a rolling pointer to the tip of dev, holding only the
          # distributions built from that commit. Delete it and its tag, then recreate both, so
          # that the tag, the target commit, and the attached artifacts stay consistent.
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # A tag can outlive its release if a previous run was interrupted between the two deletes.
          gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" 2> /dev/null || true

          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest" \
            --prerelease \
            --notes "Pre-release build of the dev branch at commit $GITHUB_SHA."

  run-ros3-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-python3.14-ros3  , python-ver: "3.14", os: ubuntu-latest }
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          auto-update-conda: true
          activate-environment: ros3
          environment-file: environment-ros3.yml
          python-version: ${{ matrix.python-ver }}
          channels: conda-forge
          auto-activate: false

      - name: Install run dependencies
        run: |
          python -m pip install .
          python -m pip list

      - name: Conda reporting
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls

      - name: Run ros3 tests  # TODO include gallery tests after they are written
        run: |
          python -m pytest tests/unit/test_io_hdf5_streaming.py
