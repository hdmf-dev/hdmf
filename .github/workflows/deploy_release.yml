name: Deploy release
on:
  push:
    tags:  # run only on new tags that follow semver MAJOR.MINOR.PATCH
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy-release:
    name: Deploy release from tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hdmf
    permissions:
      id-token: write  # mint the OIDC token for PyPI trusted publishing
      contents: write  # create the GitHub release
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip list

      - name: Run tox tests
        run: |
          tox -e pytest-py314-upgraded

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --installpkg dist/*-none-any.whl

      - name: Test installation from a source distribution
        run: |
          tox -e wheelinstall --installpkg dist/*.tar.gz

      - name: Upload wheel and source distributions to PyPI
        # Publishes to PyPI via OIDC trusted publishing. The hdmf project on PyPI must have a trusted
        # publisher configured for the hdmf-dev/hdmf repository, the deploy_release.yml workflow, and the
        # pypi environment.
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          skip-existing: true

      - name: Publish wheel and source distributions as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo hdmf-dev/hdmf \
            --title "${{ github.ref_name }}" \
            --generate-notes
