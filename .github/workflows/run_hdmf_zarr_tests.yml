name: Run HDMF-Zarr tests
on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-hdmf-zarr-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Clone HDMF-Zarr and install dev branch of HDMF
        run: |
          python -m pip list
          git clone https://github.com/hdmf-dev/hdmf-zarr.git
          cd hdmf-zarr
          python -m pip install . --group test  # this will install a different version of hdmf from the current one
          cd ..
          python -m pip uninstall -y hdmf  # uninstall the other version of hdmf
          python -m pip install .  # reinstall current branch of hdmf
          python -m pip list

      - name: Run HDMF-Zarr tests on HDMF-Zarr dev branch
        run: |
          cd hdmf-zarr
          pytest -v
