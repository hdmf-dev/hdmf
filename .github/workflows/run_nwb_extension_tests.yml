name: Run NWB Extension Tests
on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # once per day at 1 AM ET, offset from other daily workflows
  workflow_dispatch:

jobs:
  generate-extension-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests

      - name: Generate extension matrix from catalog
        id: generate-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_extension_matrix.py


  run-nwb-extension-tests:
    needs: generate-extension-matrix
    runs-on: ubuntu-latest
    name: run-nwb-extension-tests - ${{ matrix.extension.name }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.extension.name }}
      cancel-in-progress: true
    strategy:
      matrix: ${{ fromJson(needs.generate-extension-matrix.outputs.matrix) }}
      fail-fast: false  # Continue testing other extensions even if one fails
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use 3.11 for better compatibility with extensions

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install NWB extension from PyPI - ${{ matrix.extension.name }}
        run: |
          # NOTE: Installing from source is often broken because the latest default branch may not be stable
          # and other various issues, so we prioritize PyPI installation

          # Install the extension from PyPI if available
          if [ -n "${{ matrix.extension.pypi }}" ]; then
            echo "Installing extension ${{ matrix.extension.name }} from PyPI..."
            python -m pip install ${{ matrix.extension.name }}
          else
            echo "No PyPI entry for ${{ matrix.extension.name }}, skipping installation."
            exit 1
          fi

      - name: Run tests for NWB extension - ${{ matrix.extension.name }}
        run: |
          echo "Running tests for extension: ${{ matrix.extension.name }}"

          # Test basic import functionality
          extension_import_name=$(echo "${{ matrix.extension.name }}" | sed 's/-/_/g')
          python -c "import ${extension_import_name}; print('Successfully imported ${extension_import_name}')"

          # Get the location of the installed package and navigate there
          extension_location=$(python -c "import os; import ${extension_import_name}; print(os.path.dirname(${extension_import_name}.__file__))")
          if [ -n "$extension_location" ]; then
            echo "Located extension at: $extension_location"
            cd "$extension_location"

            # Try different test running approaches
            if command -v pytest &> /dev/null && find . -name "*test*.py" | head -1; then
              echo "Running tests with pytest..."
              python -m pip install pytest
              python -m pip install matplotlib scikit-image  # Common test dependencies
              python -m pytest -v --tb=short
            else
              echo "Attempting to run with python -m unittest..."
              python -m unittest discover -s . -p "*test*.py" -v
            fi
          else
            echo "Could not locate the installed extension package for ${{ matrix.extension.name }}. Skipping tests."
          fi

          echo "Completed testing ${{ matrix.extension.name }}"
