name: Run NWB Extension Tests
on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # once per day at 1 AM ET, offset from other daily workflows
  workflow_dispatch:

jobs:
  generate-extension-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests

      - name: Generate extension matrix from catalog
        id: generate-matrix
        run: |
          python scripts/generate_extension_matrix.py

  run-nwb-extension-tests:
    needs: generate-extension-matrix
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.extension.name }}
      cancel-in-progress: true
    strategy:
      matrix: ${{ fromJson(needs.generate-extension-matrix.outputs.matrix) }}
      fail-fast: false  # Continue testing other extensions even if one fails
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use 3.11 for better compatibility with extensions

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Clone and test NWB extension - ${{ matrix.extension.name }}
        run: |
          echo "Testing extension: ${{ matrix.extension.name }}"
          echo "Repository: ${{ matrix.extension.repository }}"

          # Clone the extension repository
          git clone --depth 1 ${{ matrix.extension.repository }} extension_repo
          cd extension_repo

          # Check if the repository has a setup.py or pyproject.toml
          if [[ -f "setup.py" ]] || [[ -f "pyproject.toml" ]]; then
            echo "Found installation file, proceeding with installation"
          else
            echo "No installation file found, skipping ${{ matrix.extension.name }}"
            exit 0
          fi

          # Try to install the extension
          echo "Installing extension ${{ matrix.extension.name }}..."
          python -m pip install -e .

          # Test basic import functionality
          extension_import_name=$(echo "${{ matrix.extension.name }}" | sed 's/-/_/g')
          python -c "import ${extension_import_name}; print('Successfully imported ${extension_import_name}')" || \
          echo "Import test failed for ${{ matrix.extension.name }}, but continuing..."

          # Try different test running approaches
          if command -v pytest &> /dev/null && find . -name "*test*.py" | head -1; then
            echo "Running tests with pytest..."
            python -m pytest -v --tb=short || echo "Some tests failed for ${{ matrix.extension.name }}, but continuing..."
          else
            echo "Attempting to run with python -m unittest..."
            python -m unittest discover -s . -p "*test*.py" -v || echo "unittest failed for ${{ matrix.extension.name }}, but continuing..."
          fi

          echo "Completed testing ${{ matrix.extension.name }}"
